<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/cuenta-clara/icon-512.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CuentaClara</title>
  <link rel="manifest" href="/cuenta-clara/manifest.json">
  <meta name="theme-color" content="#1e40af">
  <link rel="apple-touch-icon" href="/cuenta-clara/icon-512.png">
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/cuenta-clara/sw.js')
          .then(reg => console.log('✅ Service Worker registrado:', reg.scope))
          .catch(err => console.log('❌ Error al registrar SW:', err));
      });
    }
  </script>
</body>

</html>
