name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v5

      - name: Setup Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm install --no-audit --no-fund

      - name: Diagnóstico
        run: |
          echo "===== node_modules/@capacitor ====="
          ls -la node_modules/@capacitor/ 2>&1 || echo "NO EXISTE @capacitor"
          echo ""
          echo "===== node_modules/@capacitor/cli ====="
          ls -la node_modules/@capacitor/cli/ 2>&1 || echo "NO EXISTE @capacitor/cli"
          echo ""
          echo "===== node_modules/.bin (cap) ====="
          ls -la node_modules/.bin/ 2>&1 | grep -i cap || echo "SIN binarios cap en .bin"

      - name: Build web assets
        run: npm run build

      - name: Setup Java 21 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar Capacitor CLI global
        run: npm install -g @capacitor/cli@latest

      - name: Sync Capacitor
        run: cap sync android

      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Verificar APK generado
        run: ls -lh android/app/build/outputs/apk/debug/

      - name: Subir APK como artifact
        uses: actions/upload-artifact@v6
        with:
          name: cuenta-clara-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
