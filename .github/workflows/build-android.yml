name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v5

      - name: Setup Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm install --no-audit --no-fund

      - name: Diagnóstico Capacitor
        run: |
          echo "=== node_modules/.bin ==="
          ls node_modules/.bin/ | grep -i cap || echo "NO HAY BINARIO CAP"
          echo "=== Paquetes Capacitor ==="
          ls node_modules/@capacitor/ || echo "NO HAY CARPETA @capacitor"
          echo "=== Versión directa ==="
          ./node_modules/.bin/cap --version || echo "FALLA EL BINARIO"

      - name: Build web assets
        run: npm run build

      - name: Setup Java 17 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Sync Capacitor
        run: ./node_modules/.bin/cap sync android

      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Verificar APK
        run: ls -lh android/app/build/outputs/apk/debug/

      - name: Subir APK como artifact
        uses: actions/upload-artifact@v6
        with:
          name: cuenta-clara-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30